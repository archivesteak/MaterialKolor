# Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# MPP
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true

# Compose
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.wasm.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.macos.enabled=true
org.jetbrains.compose.experimental.mingw.enabled=true

# Remote release is intentionally inert in this fork. Local Maven publication is still used for
# validation; a future durable release requires a reviewed source change that removes the task
# guards, in addition to explicitly supplying its own signing/release properties.
# Vanniktech's modern opt-out is load-bearing: merely disabling automatic release would still
# register a Central repository and upload tasks. Keep the remote repository absent altogether.
mavenCentralPublishing=false
mavenCentralAutomaticPublishing=false
RELEASE_SIGNING_ENABLED=false

# Fork coordinates. Publishing under the upstream group would put a differently-built artifact at
# coordinates upstream owns, so this fork claims its own namespace. The SCM/URL fields point at the
# fork for the same reason: they must describe the tree these artifacts were actually built from.
GROUP=io.github.archivesteak.materialkolor
# Upstream supplies this only from CI (ORG_GRADLE_PROJECT_VERSION_NAME in publish.yml), which leaves
# a local publish with no version at all. This fork carries the upstream 5.0.1 Android dependency
# fix plus the mingwX64 target, with the same -mingw marker the other forks use.
VERSION_NAME=5.0.1-mingw
