name: Source contract checks

on:
  workflow_dispatch:
  push:
    branches: [main, mingw]
  pull_request:

permissions:
  contents: read

concurrency:
  group: materialkolor-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Reject malformed patches
        run: git diff --check HEAD^

      - name: Test release provenance and workflow contracts
        run: python3 -m unittest discover .github/scripts -p 'test_*.py' -v

      - name: Compile-check release scripts
        run: python3 -m py_compile .github/scripts/*.py

      # Full Gradle verification intentionally lives in release-host-shards.yml. It first
      # reconstructs the exact provenance-unioned core repository; this source job must never
      # fall back to Maven Central or an ambient ~/.m2 for fork coordinates.
