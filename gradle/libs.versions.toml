[versions]
runtime = "1.10.0"
sdk-compile = "37"
sdk-min = "21"
jvmTarget = "17"
agp = "9.2.1"
kotlin = "2.4.0"
# The core Compose and Material3 release trains have distinct versions. This exact Material3
# source is JetBrains 1.12.0-alpha03 (based on Jetpack Material3 1.5.0-alpha22).
compose-fork = "1.12.0-beta02-mingw"
compose-material3 = "1.12.0-alpha03-mingw"
androidx-annotation = "1.10.0"
binaryCompatibility = "0.18.1"
dokka = "2.2.0"
publish = "0.37.0"
colormath = "3.6.1"
poko = "0.23.1"
errorProneAnnotations = "2.50.0"
kotest = "6.2.2"
ktlint = "1.8.0"
spotless = "8.8.0"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
colormath = { module = "com.github.ajalt.colormath:colormath", version.ref = "colormath" }
errorProneAnnotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorProneAnnotations" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
compose-foundation = { module = "io.github.archivesteak.compose.foundation:foundation", version.ref = "compose-fork" }
compose-runtime = { module = "io.github.archivesteak.compose.runtime:runtime", version.ref = "compose-fork" }
compose-ui = { module = "io.github.archivesteak.compose.ui:ui", version.ref = "compose-fork" }
compose-ui-test = { module = "io.github.archivesteak.compose.ui:ui-test", version.ref = "compose-fork" }
compose-material3 = { module = "io.github.archivesteak.compose.material3:material3", version.ref = "compose-material3" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose = { id = "io.github.archivesteak.compose", version.ref = "compose-fork" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
multiplatform-android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
binaryCompatibility = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibility" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
poko = { id = "dev.drewhamilton.poko", version.ref = "poko" }
spotless = {id = "com.diffplug.spotless", version.ref = "spotless"}
